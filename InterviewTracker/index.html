<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile-first viewport. viewport-fit=cover is required for env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Editorial type stack: Inter Variable (display) + JetBrains Mono (metadata). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>Interview Tracker — .NET &amp; Pentest</title>
    <meta name="description" content="Spaced-repetition tracker for 530 .NET and 500 Pentest interview questions. Offline-first, SQLite in the browser, XP and streaks built in." />

    <!-- Theme colour driven by colour-scheme preference. Matches midnight (dark) / mint (light). -->
    <meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f9f7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS standalone behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Interview Tracker" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons. PNG variants for iOS / Android home-screen + Lighthouse installability. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (link previews). Minimal set. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interview Tracker — .NET &amp; Pentest" />
    <meta property="og:description" content="Spaced-repetition tracker for 530 .NET and 500 Pentest interview questions. Offline-first, SQLite in the browser." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Prevent telephone-number auto-linking on iOS. -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app requires JavaScript. Enable it and reload.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
